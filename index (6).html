<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Altynay Zhumatay — Business Analytics, Strategy & Technology</title>
<meta name="description" content="Portfolio of Altynay Zhumatay, Business Analytics & Technologies student at Carnegie Mellon University in Qatar. Case studies in machine learning, strategy consulting, UX research and consumer insights.">
<meta property="og:title" content="Altynay Zhumatay — Turning data into better business decisions">
<meta property="og:description" content="Case studies in analytics, strategy and technology from a Carnegie Mellon University in Qatar senior.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@500;600;700&family=Instrument+Serif&display=swap" rel="stylesheet">
<style>
/* ---------- Tokens ---------- */
:root{
  --bg:#FAF9F6; --ink:#202124; --sand:#E8E3DC; --mute:#6F6F6F; --line:#DDD7CE;
  --accent:#B86B50; --accent-text:#9E5840; --accent-soft:#E9CFC3; --surface:#F2EEE8; --card:#FFFFFF;
  --head:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --serif:"Instrument Serif",Georgia,"Times New Roman",serif;
  --max:1160px; --gutter:clamp(20px,4vw,40px);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1A1B1D; --ink:#ECE8E1; --sand:#34322F; --mute:#A6A29B; --line:#3A3835;
    --accent:#D08A6E; --accent-text:#E0A287; --accent-soft:#5A3B30; --surface:#222326; --card:#242528;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1A1B1D; --ink:#ECE8E1; --sand:#34322F; --mute:#A6A29B; --line:#3A3835;
  --accent:#D08A6E; --accent-text:#E0A287; --accent-soft:#5A3B30; --surface:#222326; --card:#242528;
  color-scheme:dark;
}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 80px);scroll-behavior:smooth}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.65 var(--body);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
img,svg{max-width:100%}
a{color:var(--accent-text);text-decoration-thickness:1px;text-underline-offset:3px}
a:hover{color:var(--ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:2px}
h1,h2,h3,h4{font-family:var(--head);font-weight:600;letter-spacing:-.02em;line-height:1.15;margin:0}
p{margin:0 0 1em}
.wrap{max-width:var(--max);margin:0 auto;padding:0 var(--gutter)}
.skip{position:absolute;left:-999px;top:8px;background:var(--ink);color:var(--bg);padding:8px 14px;z-index:50;border-radius:4px}
.skip:focus{left:12px}
.muted{color:var(--mute)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- Header ---------- */
header.site{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:saturate(1.2) blur(10px);-webkit-backdrop-filter:saturate(1.2) blur(10px);border-bottom:1px solid transparent;transition:border-color .2s}
header.site.scrolled{border-bottom-color:var(--line)}
.nav{display:flex;align-items:center;justify-content:space-between;height:64px;gap:24px}
.brand{font-family:var(--head);font-weight:700;font-size:1rem;color:var(--ink);text-decoration:none;letter-spacing:-.01em}
.nav ul{list-style:none;display:flex;gap:28px;margin:0;padding:0;align-items:center}
.nav ul a{color:var(--mute);text-decoration:none;font-size:.92rem;font-weight:500}
.nav ul a:hover,.nav ul a[aria-current="page"]{color:var(--ink)}
.nav ul a[aria-current="page"]{box-shadow:inset 0 -1px 0 var(--accent)}
.resume-link{font-size:.88rem;font-weight:500;padding:7px 14px;border:1px solid var(--ink);border-radius:999px;color:var(--ink)!important;text-decoration:none}
.resume-link:hover{background:var(--ink);color:var(--bg)!important}
.resume-pending{font-size:.82rem;padding:6px 12px;border:1px dashed var(--accent);border-radius:999px;color:var(--accent-text);white-space:nowrap}
.menu-btn{display:none;background:none;border:1px solid var(--line);border-radius:6px;padding:8px 12px;font:500 .9rem var(--body);color:var(--ink);cursor:pointer}
@media (max-width:820px){
  .menu-btn{display:block}
  .nav ul{display:none;position:absolute;left:0;right:0;top:64px;flex-direction:column;align-items:flex-start;gap:4px;background:var(--bg);border-bottom:1px solid var(--line);padding:12px var(--gutter) 20px}
  .nav ul.open{display:flex}
  .nav ul a{font-size:1.05rem;display:block;padding:8px 0}
}

/* ---------- Main transitions ---------- */
main{min-height:70vh;outline:none}
main.enter{animation:enter .35s ease-out}
@keyframes enter{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---------- Placeholders ---------- */
.tbc{display:inline-block;font:500 .8em/1.4 var(--body);color:var(--accent-text);border:1px dashed var(--accent);border-radius:4px;padding:1px 7px;background:color-mix(in srgb,var(--accent-soft) 30%,transparent)}
.tbc-block{border:1px dashed var(--accent);border-radius:6px;padding:16px 18px;color:var(--ink);background:color-mix(in srgb,var(--accent-soft) 18%,transparent);font-size:.95rem}
.tbc-block strong{font-family:var(--head);font-weight:600;color:var(--accent-text);display:block;font-size:.85rem;margin-bottom:4px}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;gap:8px;font:600 .95rem var(--head);padding:13px 22px;border-radius:999px;text-decoration:none;border:1px solid var(--ink);transition:background .15s,color .15s}
.btn-primary{background:var(--ink);color:var(--bg)}
.btn-primary:hover{background:var(--accent);border-color:var(--accent);color:#fff}
.btn-ghost{color:var(--ink)}
.btn-ghost:hover{background:var(--sand);color:var(--ink)}

/* ---------- Hero ---------- */
.hero{padding:clamp(56px,10vw,120px) 0 clamp(48px,7vw,88px);display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:clamp(32px,5vw,72px);align-items:end}
.eyebrow{font:500 .9rem var(--body);color:var(--mute);margin-bottom:22px}
.hero h1{font-size:clamp(2.7rem,6.4vw,5rem);line-height:1.0;letter-spacing:-.045em;font-weight:600;max-width:11ch}
.hero .lede{font-size:clamp(1.05rem,1.5vw,1.2rem);max-width:56ch;margin:28px 0 34px;color:var(--ink)}
.cta-row{display:flex;flex-wrap:wrap;gap:12px}
.hero-meta{margin-top:40px;font-size:.88rem;color:var(--mute);padding-top:18px;border-top:1px solid var(--line);max-width:460px}
.hero-viz figure{margin:0}
.hero-viz svg{display:block;width:100%;height:auto}
.hero-viz figcaption{font-size:.82rem;color:var(--mute);margin-top:10px}
.dot{transition:transform 1.4s cubic-bezier(.65,0,.35,1),fill .6s ease 1.1s}
.hero-solo{grid-template-columns:minmax(0,1fr)}
.hero-solo h1{max-width:14ch}
@media (max-width:880px){.hero{grid-template-columns:1fr;align-items:start}.hero-viz{max-width:460px}}

/* ---------- Sections ---------- */
.section{padding:clamp(56px,8vw,96px) 0;border-top:1px solid var(--line)}
.section-head{display:flex;justify-content:space-between;align-items:end;gap:24px;margin-bottom:40px;flex-wrap:wrap}
.section-head h2{font-size:clamp(1.8rem,3.2vw,2.5rem);letter-spacing:-.03em}
.section-head p{margin:10px 0 0;color:var(--mute);max-width:58ch}
.text-link{font-weight:500;font-size:.95rem}

/* ---------- Project cards ---------- */
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:48px 40px}
@media (max-width:760px){.grid2{grid-template-columns:1fr;gap:44px}}
.pcard{display:flex;flex-direction:column}
.pcard .thumb{display:block;background:var(--surface);border:1px solid var(--line);border-radius:6px;aspect-ratio:16/10;overflow:hidden;transition:border-color .2s}
.pcard .thumb svg{width:100%;height:100%;display:block}
.pcard .thumb img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .4s ease}
.pcard:hover .thumb img{transform:scale(1.02)}
.pcard:hover .thumb{border-color:var(--accent)}
.pmeta{display:flex;gap:14px;margin:18px 0 8px;font-size:.84rem;color:var(--mute);flex-wrap:wrap}
.pcard h3{font-size:1.32rem;letter-spacing:-.02em;margin-bottom:10px}
.pcard h3 a{color:var(--ink);text-decoration:none}
.pcard h3 a:hover{color:var(--accent-text)}
.pcard p{color:var(--ink);font-size:.98rem;margin-bottom:14px;max-width:60ch}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 16px;padding:0;list-style:none}
.tags li{font-size:.8rem;padding:3px 10px;border-radius:999px;background:var(--sand);color:var(--ink)}
.pcard .go{margin-top:auto;font-weight:600;font-family:var(--head);font-size:.92rem}
.pcard.feature{grid-column:1/-1;display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:40px;align-items:center}
.pcard.feature .pmeta{margin-top:0}
@media (max-width:760px){.pcard.feature{grid-template-columns:1fr;gap:0}.pcard.feature .pmeta{margin-top:18px}}
.t-a{fill:var(--accent)} .t-i{fill:var(--ink)} .t-s{fill:var(--sand)} .t-m{fill:var(--mute)} .t-l{stroke:var(--line);fill:none}
.t-txt{font-family:var(--head);fill:var(--mute);font-size:12px} .t-big{font-family:var(--serif);fill:var(--ink)}

/* ---------- Experience ---------- */
.xp{list-style:none;margin:0;padding:0}
.xp li{display:grid;grid-template-columns:minmax(0,4fr) minmax(0,8fr);gap:24px;padding:26px 0;border-top:1px solid var(--line)}
.xp li:last-child{border-bottom:1px solid var(--line)}
.xp h3{font-size:1.12rem}
.xp .org{color:var(--mute);font-size:.95rem;margin-top:4px}
.xp .dates{font-size:.86rem;color:var(--mute);margin-top:8px}
.xp p{margin:0;max-width:62ch}
@media (max-width:700px){.xp li{grid-template-columns:1fr;gap:8px}}
.xp-detail ul{margin:12px 0 0;padding-left:1.1em}
.xp-detail li{display:list-item;border:0;padding:3px 0;grid-template-columns:none}
.xp-detail li:last-child{border:0}

/* ---------- About preview ---------- */
.about-grid{display:grid;grid-template-columns:minmax(0,4fr) minmax(0,8fr);gap:40px}
.about-grid .big{font-family:var(--head);font-size:clamp(1.25rem,2.1vw,1.55rem);line-height:1.45;letter-spacing:-.015em;font-weight:500;max-width:34ch}
@media (max-width:760px){.about-grid{grid-template-columns:1fr;gap:16px}}

/* ---------- Footer ---------- */
footer.site{border-top:1px solid var(--line);padding:56px 0 48px;margin-top:40px}
.foot{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:32px}
.foot h2{font-size:1.6rem;letter-spacing:-.03em}
.foot dl{display:grid;grid-template-columns:auto 1fr;gap:10px 22px;margin:0;font-size:.95rem}
.foot dt{color:var(--mute)}
.foot dd{margin:0}
.copy{margin-top:40px;font-size:.82rem;color:var(--mute)}
@media (max-width:700px){.foot{grid-template-columns:1fr}}

/* ---------- Page headers ---------- */
.page-head{padding:clamp(48px,8vw,96px) 0 clamp(32px,5vw,56px)}
.page-head h1{font-size:clamp(2.4rem,5.4vw,4rem);letter-spacing:-.04em;line-height:1.02;max-width:18ch}
.page-head p{font-size:1.12rem;max-width:58ch;margin-top:22px;color:var(--mute)}

/* ---------- Case study ---------- */
.cs-hero{padding:clamp(40px,7vw,80px) 0 40px}
.crumb{font-size:.88rem;margin-bottom:28px;display:inline-block}
.cs-hero .cat{color:var(--mute);font-size:.92rem;margin-bottom:16px}
.cs-hero h1{font-size:clamp(2.2rem,5vw,3.7rem);letter-spacing:-.04em;line-height:1.03;max-width:20ch}
.cs-hero .sub{font-size:clamp(1.08rem,1.6vw,1.25rem);max-width:56ch;margin-top:22px;color:var(--ink)}
.status{display:inline-block;font:600 .78rem var(--head);padding:3px 10px;border-radius:999px;margin-left:8px;vertical-align:middle}
.status.ongoing{background:var(--accent-soft);color:var(--ink)}
.status.done{background:var(--sand);color:var(--ink)}
.glance{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:0;border-top:1px solid var(--ink);border-bottom:1px solid var(--line);margin:8px 0 0}
.glance div{padding:16px 18px 16px 0}
.glance dt{font-size:.8rem;color:var(--mute);margin-bottom:4px}
.glance dd{margin:0;font-size:.95rem;font-weight:500}
.cs-body{display:grid;grid-template-columns:200px minmax(0,1fr);gap:56px;padding:56px 0 24px}
.toc{position:sticky;top:96px;align-self:start;font-size:.86rem}
.toc ol{list-style:none;margin:0;padding:0;counter-reset:t}
.toc li{counter-increment:t;margin:0 0 9px}
.toc a{color:var(--mute);text-decoration:none;display:flex;gap:10px}
.toc a::before{content:counter(t,decimal-leading-zero);font-variant-numeric:tabular-nums;color:var(--line);min-width:1.4em}
.toc a:hover{color:var(--ink)}
@media (max-width:900px){.cs-body{grid-template-columns:1fr;gap:0}.toc{display:none}}
.cs-sec{padding:0 0 64px;max-width:760px}
.cs-sec h2{font-size:1.6rem;letter-spacing:-.025em;margin-bottom:18px}
.cs-sec h3{font-size:1.06rem;margin:26px 0 8px}
.cs-sec ul.plain{padding-left:1.15em;margin:0 0 1em}
.cs-sec ul.plain li{margin-bottom:6px}
.callout{border-left:2px solid var(--accent);padding:6px 0 6px 18px;margin:22px 0;font-size:.96rem}
.callout strong{font-family:var(--head)}
.label-row{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 18px}
.pill{font-size:.78rem;font-weight:600;font-family:var(--head);padding:3px 10px;border-radius:999px;border:1px solid var(--line)}
.pill.ip{border-color:var(--accent);color:var(--accent-text)}
.pill.pr{background:var(--sand);border-color:var(--sand)}
.pill.syn{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:0;margin:20px 0;border-top:1px solid var(--line)}
.stat{padding:18px 16px 18px 0;border-bottom:1px solid var(--line)}
.stat b{display:block;font-family:var(--serif);font-weight:400;font-size:2.4rem;line-height:1;letter-spacing:-.01em;margin-bottom:8px;font-variant-numeric:lining-nums}
.stat span{font-size:.86rem;color:var(--mute)}

/* charts */
figure.chart{margin:28px 0;padding:24px;background:var(--card);border:1px solid var(--line);border-radius:6px}
figure.chart figcaption{font-size:.84rem;color:var(--mute);margin-top:16px;line-height:1.5}
.chart-title{font-family:var(--head);font-weight:600;font-size:1rem;margin:0 0 4px}
.chart-sub{font-size:.85rem;color:var(--mute);margin:0 0 20px}
.hb-row{display:grid;grid-template-columns:minmax(110px,190px) 1fr 64px;align-items:center;gap:14px;margin:10px 0;font-size:.9rem}
.hb-track{height:14px;background:var(--surface);border-radius:2px;position:relative}
.hb-bar{position:absolute;top:0;bottom:0;left:0;background:var(--mute);border-radius:2px}
.hb-bar.hl{background:var(--accent)}
.hb-v{font-variant-numeric:tabular-nums;text-align:right;font-weight:500}
@media (max-width:560px){.hb-row{grid-template-columns:1fr 56px;gap:4px 10px}.hb-row .hb-l{grid-column:1/-1}}
.toggle{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;margin-bottom:18px}
.toggle button{font:500 .84rem var(--body);background:none;border:0;padding:6px 14px;border-radius:999px;color:var(--mute);cursor:pointer}
.toggle button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.cmp .mode{display:none}
.cmp[data-mode="side"] .mode-side,.cmp[data-mode="gap"] .mode-gap{display:block}
.cmp-row{display:grid;grid-template-columns:minmax(120px,200px) 1fr;gap:16px;align-items:center;padding:12px 0;border-top:1px solid var(--line);font-size:.9rem}
.cmp-row:first-child{border-top:0}
.pair{display:grid;gap:5px}
.pair .ln{display:grid;grid-template-columns:1fr 56px;gap:10px;align-items:center}
.pair .bar{height:11px;border-radius:2px}
.bz{background:var(--accent)} .cz{background:var(--mute)}
.pair .v{font-variant-numeric:tabular-nums;text-align:right;font-size:.84rem}
.legend{display:flex;gap:18px;font-size:.82rem;color:var(--mute);margin-bottom:8px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.div-track{position:relative;height:14px;background:var(--surface);border-radius:2px}
.div-zero{position:absolute;top:-4px;bottom:-4px;width:1px;background:var(--ink)}
.div-bar{position:absolute;top:0;bottom:0;border-radius:2px}
.div-row{display:grid;grid-template-columns:1fr 70px;gap:10px;align-items:center}
@media (max-width:560px){.cmp-row{grid-template-columns:1fr;gap:8px}}

.cols{display:flex;align-items:flex-end;gap:clamp(10px,3vw,28px);height:240px;position:relative;padding-top:28px;border-bottom:1px solid var(--ink)}
.col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:stretch;height:100%;position:relative}
.col .bar{background:var(--mute);border-radius:2px 2px 0 0;position:relative}
.col.hl .bar{background:var(--accent)}
.col .val{position:absolute;top:-24px;left:0;right:0;text-align:center;font-weight:600;font-size:.9rem;font-variant-numeric:tabular-nums}
.col-labels{display:flex;gap:clamp(10px,3vw,28px);margin-top:10px}
.col-labels span{flex:1;text-align:center;font-size:.82rem;color:var(--mute);line-height:1.35}
.baseline{position:absolute;left:0;right:0;border-top:1px dashed var(--ink);opacity:.55}
.baseline span{position:absolute;right:0;top:-20px;font-size:.75rem;color:var(--mute);background:var(--card);padding:0 4px}

.stack{display:flex;height:40px;border-radius:3px;overflow:hidden;margin:6px 0 14px}
.stack span{display:flex;align-items:center;padding-left:10px;font-size:.84rem;font-weight:600;white-space:nowrap;overflow:hidden}
.s1{background:var(--accent);color:#fff} .s2{background:var(--accent-soft);color:var(--ink)} .s3{background:var(--sand);color:var(--ink)}

.pipeline{list-style:none;padding:0;margin:20px 0;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;counter-reset:p}
.pipeline li{counter-increment:p;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:14px;font-size:.9rem;font-weight:500;font-family:var(--head);position:relative}
.pipeline li::before{content:counter(p);display:block;font-family:var(--serif);font-weight:400;font-size:1.6rem;color:var(--accent);line-height:1;margin-bottom:8px}
.pipeline li small{display:block;font-family:var(--body);font-weight:400;color:var(--mute);font-size:.8rem;margin-top:4px}
.pipeline li.tbd{border-style:dashed}

.chips{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 20px;padding:0;list-style:none}
.chips li{border:1px solid var(--line);background:var(--card);border-radius:4px;padding:7px 12px;font-size:.88rem}

.tiers{display:grid;gap:10px}
.tier{display:grid;grid-template-columns:minmax(0,1fr);gap:6px}
.tier-bar{height:36px;border-radius:3px;display:flex;align-items:center;padding:0 12px;font-weight:600;font-size:.86rem;font-family:var(--head);white-space:nowrap}
.tier .desc{font-size:.86rem;color:var(--mute)}

.gauge{position:relative;height:16px;border-radius:999px;background:linear-gradient(90deg,var(--sand),var(--surface) 50%,var(--sand));margin:44px 0 30px;border:1px solid var(--line)}
.gauge .z{position:absolute;left:50%;top:-6px;bottom:-6px;width:1px;background:var(--mute)}
.gauge .mk{position:absolute;top:50%;width:18px;height:18px;border-radius:50%;background:var(--accent);transform:translate(-50%,-50%);border:3px solid var(--card)}
.gauge .mk-l{position:absolute;bottom:22px;transform:translateX(-50%);font-family:var(--serif);font-size:1.8rem;line-height:1;white-space:nowrap}
.gauge-scale{display:flex;justify-content:space-between;font-size:.78rem;color:var(--mute)}

table.fw{width:100%;border-collapse:collapse;font-size:.88rem;margin:6px 0}
.tw{overflow-x:auto;margin:24px 0}
table.fw th,table.fw td{text-align:left;padding:11px 12px 11px 0;border-bottom:1px solid var(--line);vertical-align:top}
table.fw thead th{font-family:var(--head);font-weight:600;border-bottom:1px solid var(--ink);font-size:.84rem}
table.fw td.empty{color:var(--mute)}

.ph{margin:24px 0;border:1px dashed var(--line);border-radius:6px;padding:28px 24px;background:repeating-linear-gradient(135deg,transparent 0 12px,color-mix(in srgb,var(--sand) 35%,transparent) 12px 13px)}
.ph strong{display:block;font-family:var(--head);font-size:1rem;margin-bottom:6px}
.ph .k{font-size:.8rem;color:var(--accent-text);font-weight:600;margin-bottom:8px;display:block}
.ph p{margin:0;font-size:.9rem;color:var(--mute);max-width:56ch}

.findings{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin:18px 0}
.finding{border-top:2px solid var(--ink);padding-top:12px}
.finding h3{margin:0 0 6px;font-size:1rem}
.finding p{font-size:.93rem;margin:0}
@media (max-width:600px){.findings{grid-template-columns:1fr}}

.artifacts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.artifacts .ph{margin:0}

.next{border-top:1px solid var(--ink);padding:36px 0 20px;display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap;align-items:end}
.next small{display:block;color:var(--mute);font-size:.85rem;margin-bottom:6px}
.next a.nx{font-family:var(--head);font-weight:600;font-size:clamp(1.3rem,2.6vw,1.8rem);letter-spacing:-.025em;color:var(--ink);text-decoration:none;max-width:28ch;display:block;line-height:1.2}
.next a.nx:hover{color:var(--accent-text)}

/* presentation link */
.deck{display:grid;grid-template-columns:auto 1fr auto;gap:20px;align-items:center;padding:22px;border:1px solid var(--line);border-radius:6px;background:var(--card);text-decoration:none;color:var(--ink);transition:border-color .2s}
.deck:hover{border-color:var(--accent);color:var(--ink)}
.deck-k{font:600 .78rem var(--head);background:var(--accent);color:#fff;border-radius:4px;padding:10px 9px}
.deck strong{display:block;font-family:var(--head);font-weight:600;margin-bottom:4px}
.deck .muted{font-size:.88rem;display:block}
.deck-go{font:600 .9rem var(--head);color:var(--accent-text);white-space:nowrap}
@media (max-width:600px){.deck{grid-template-columns:1fr;gap:10px}.deck-k{justify-self:start}}
/* compact cards */
.mini-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
@media (max-width:860px){.mini-grid{grid-template-columns:1fr}}
.mini{border:1px solid var(--line);border-radius:6px;padding:22px;background:var(--card)}
.mini h3{font-size:1.04rem;margin-bottom:8px}
.mini p{font-size:.92rem;margin-bottom:12px}
.mini .tags{margin:0}

/* about page */
.about-page{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:64px;padding-bottom:40px}
.about-page .bio p{font-size:1.08rem;max-width:62ch}
.edu{border-top:1px solid var(--ink);padding-top:16px}
.edu dl{margin:0}
.edu dt{font-size:.8rem;color:var(--mute);margin-top:12px}
.edu dd{margin:2px 0 0;font-weight:500}
.skills{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:28px 40px;margin-top:20px}
.skills h3{font-size:1rem;margin-bottom:10px}
@media (max-width:860px){.about-page{grid-template-columns:1fr;gap:40px}.skills{grid-template-columns:1fr}}

/* contact */
.contact-list{list-style:none;padding:0;margin:0;border-top:1px solid var(--ink);max-width:720px}
.contact-list li{display:grid;grid-template-columns:160px 1fr;gap:16px;padding:20px 0;border-bottom:1px solid var(--line);align-items:center}
.contact-list .k{color:var(--mute);font-size:.92rem}
.contact-list .v{font-family:var(--head);font-weight:600;font-size:1.15rem}
@media (max-width:560px){.contact-list li{grid-template-columns:1fr;gap:4px}}

@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  main.enter{animation:none}
  .dot{transition:none}
  *{transition-duration:0s!important}
}

/* ---------- Charts (div-based, responsive, screen-reader labelled) ---------- */
function hbars(rows, {max=100, title, sub, caption, aria}){
  return `<figure class="chart"><p class="chart-title">${title}</p>${sub?`<p class="chart-sub">${sub}</p>`:""}
  <div role="img" aria-label="${esc(aria)}">${rows.map(r=>`
    <div class="hb-row"><span class="hb-l">${r.label}</span><span class="hb-track"><span class="hb-bar ${r.hl?'hl':''}" style="width:${r.v/max*100}%"></span></span><span class="hb-v">${r.d}</span></div>`).join("")}
  </div>${caption?`<figcaption>${caption}</figcaption>`:""}</figure>`;
}

function columns(rows, {max, title, sub, caption, aria, baseline}){
  const bl = baseline ? `<div class="baseline" style="bottom:${baseline.v/max*100}%"><span>${baseline.label}</span></div>` : "";
  return `<figure class="chart"><p class="chart-title">${title}</p>${sub?`<p class="chart-sub">${sub}</p>`:""}
  <div role="img" aria-label="${esc(aria)}">
    <div class="cols">${bl}${rows.map(r=>`<div class="col ${r.hl?'hl':''}"><div class="bar" style="height:${r.v/max*100}%"><span class="val">${r.d}</span></div></div>`).join("")}</div>
    <div class="col-labels" aria-hidden="true">${rows.map(r=>`<span>${r.label}</span>`).join("")}</div>
  </div>${caption?`<figcaption>${caption}</figcaption>`:""}</figure>`;
}

"mastercard-dataquest": p => ({
  challenge: `<p>Some entrepreneurs and self-employed people pay for inventory, ads, software and other business costs with an ordinary consumer card. The bank sees a consumer; the spending says business. That means missed business-card revenue, missed cross-sell opportunities, and commercial spending counted as consumer behavior.</p>
  <p>Our challenge was to build a machine learning solution that recognizes business-like transaction patterns and helps the bank prioritize those cardholders for outreach.</p>
  <div class="label-row"><span class="pill syn">Synthetic data</span></div>
  <div class="stats"><div class="stat"><b>12.8M</b><span>Transactions (3.0M business, 9.8M consumer)</span></div><div class="stat"><b>105,000</b><span>Cards: 25,000 business, 80,000 consumer</span></div><div class="stat"><b>2,165</b><span>Merchants</span></div><div class="stat"><b>6 mo</b><span>Transaction history</span></div><div class="stat"><b>47</b><span>Engineered behavioral features</span></div></div>
  <p class="muted" style="font-size:.88rem">All data was fully synthetic and supplied by the challenge organizers.</p>`,
  approach: `<ol class="pipeline"><li>Raw transaction data</li><li>Exploratory analysis</li><li>Feature engineering</li><li>Positive-unlabeled learning</li><li>Model comparison</li><li>Customer prioritization</li></ol>
  <h3>Exploratory analysis</h3><p>We compared how business and consumer cardholders spend: what they buy, how much, through which channels, and at what times of day and week.</p>
  <h3>Feature engineering</h3><p>We built 47 card-level behavioral features across seven groups. Every count has a matching ratio, so a card with 50 transactions and a card with 500 are compared on behavior rather than volume.</p>
  <ul class="chips"><li>Payment channels</li><li>B2B merchant categories</li><li>Transaction amounts</li><li>Temporal behavior</li><li>Recurring payments</li><li>Merchant diversity</li><li>Spending volatility</li></ul>
  <h3>Cleaning the labels with positive-unlabeled learning</h3><p>Labeling all 80,000 consumer cards as "not a business" would teach the model that hidden entrepreneurs look like consumers. Instead, we planted 3,000 confirmed business cards ("spies") into the consumer pool, trained a detector, and used the spies' scores to set a threshold. Consumer cards scoring below it became reliable negatives, and the final model trained only on those and the confirmed business cards.</p>
  <h3>Testing on unseen cardholders</h3><p>We split cards 80/20 by cardholder, so no one appeared in both sets: 84,000 cards for training and 21,000 completely new cards for testing.</p>
  <h3>Choosing the model</h3><p>We compared a logistic regression baseline with LightGBM. LightGBM was selected because it needs no feature scaling, handles the 3.2:1 class imbalance directly, and stops early (at 187 trees) to avoid overfitting. We tested five hyperparameter configurations with 5-fold cross-validation.</p>`,
  findings: `${mcCompare()}
  ${hbars([{label:"Online / channel",v:2893,d:"2,893",hl:true},{label:"Recurring",v:2242,d:"2,242"},{label:"Amount",v:2014,d:"2,014"},{label:"Temporal",v:1357,d:"1,357"},{label:"Merchant diversity",v:1291,d:"1,291"},{label:"B2B merchant categories",v:1216,d:"1,216"},{label:"Value flags",v:1209,d:"1,209"}],{max:3000,title:"What the model relies on",sub:"LightGBM feature importance by feature group (total splits)",aria:"Feature importance by group: online and channel 2,893; recurring 2,242; amount 2,014; temporal 1,357; merchant diversity 1,291; B2B merchant categories 1,216; value flags 1,209.",caption:"How a card pays (online and tokenized payments) mattered most, followed by recurring billing and transaction size. The single strongest feature was the share of tokenized payments."})}
  <h3>Model results on 21,000 unseen cards</h3>
  <div class="tw"><table class="fw"><thead><tr><th>Metric</th><th>Logistic regression (baseline)</th><th>LightGBM + PU learning (final)</th></tr></thead><tbody>
  <tr><td>ROC-AUC</td><td>1.0000</td><td>1.0000</td></tr>
  <tr><td>F1 score</td><td>0.9996</td><td>0.9999</td></tr>
  <tr><td>Precision</td><td>0.9996</td><td>1.0000</td></tr>
  <tr><td>Recall</td><td>0.9996</td><td>0.9998</td></tr>
  <tr><td>Misclassified cards</td><td>4 of 21,000</td><td>1 of 21,000</td></tr>
  </tbody></table></div>
  <p class="muted" style="font-size:.9rem">Both models separate the two groups almost perfectly, which reflects how cleanly behavior differs in this synthetic dataset. Noisier real-world data would be the true test.</p>`,
  recs: `<p>We ranked all 80,000 consumer cards by model score and turned the ranking into an outreach plan, matching the cost of each channel to the model's confidence.</p>${mcTiers()}
  <h3>Proposed rollout</h3>
  <ol class="pipeline"><li>Immediate<small>Send the top 800 cards to business banking managers with a simple business-card offer</small></li><li>Cross-sell<small>Once business activity is confirmed, offer working capital loans, POS terminals, payroll tools and cash registers</small></li><li>Calibrate<small>Adjust the score cutoff to team capacity: lower for more leads, higher for stronger ones</small></li><li>Maintain<small>Retrain monthly and update the B2B merchant list with banking and merchant experts</small></li></ol>
  <div class="label-row"><span class="pill pr">Proposed strategy, not an implemented campaign</span></div>`,
  limits: `<ul class="plain"><li>Synthetic data with near-perfect separation, so performance on real card data is unknown.</li><li>Some label noise among business cards.</li><li>No features for trends over time or for links between cards and merchants.</li><li>Not deployed or tested at a bank.</li></ul>`,
  lessons: `A near-perfect score is a reason to question the data, not to celebrate. The parts of this project that mattered most were the ones that make a model trustworthy: testing on cardholders the model had never seen, and cleaning hidden entrepreneurs out of the "consumer" labels before training. And a model only becomes useful to a bank once its scores turn into a decision, which is why we ended with outreach tiers rather than accuracy figures.`,

    <span class="deck-go">Open presentation</span></a>`
}),

function heroViz(){
  // 36 dots: scattered "observations" that sort into ascending columns; the tallest column becomes the decision.
  const cols=[3,4,5,6,7,8,3]; // dots per column (sum 36)
  let dots="", id=0;
  const rnd = (n)=>{const x=Math.sin(n*9301+49297)*233280; return x-Math.floor(x);};
  cols.forEach((c,ci)=>{for(let k=0;k<c;k++){
    const tx=40+ci*48, ty=330-k*30;
    const sx=30+rnd(id*3+1)*340, sy=40+rnd(id*7+2)*250;
    const final = ci===5;
    dots+=`<circle class="dot${final?' fin':''}" r="9" cx="${tx}" cy="${ty}" data-dx="${sx-tx}" data-dy="${sy-ty}" style="fill:var(--mute);opacity:.85"/>`;
    id++;}});
  return `<figure aria-hidden="false"><svg id="heroSvg" viewBox="0 0 380 360" role="img" aria-label="Scattered points sorting themselves into ordered columns, with one column highlighted as the chosen option">
  <line x1="16" x2="364" y1="350" y2="350" stroke="var(--line)"/>${dots}</svg>
  <figcaption>Scattered observations, sorted until one option stands out.</figcaption></figure>`;
}
function playHero(){
  const svg=document.getElementById("heroSvg"); if(!svg) return;
  const dots=[...svg.querySelectorAll(".dot")];
  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  const finish=()=>dots.forEach(d=>{d.style.transform="translate(0,0)"; if(d.classList.contains("fin")) d.style.fill="var(--accent)"; else d.style.opacity=".35";});
  if(reduce){finish();return;}
  dots.forEach(d=>{d.style.transition="none";d.style.transform=`translate(${d.dataset.dx}px,${d.dataset.dy}px)`;});
  svg.getBoundingClientRect();
  setTimeout(()=>{dots.forEach((d,i)=>{d.style.transition="";d.style.transitionDelay=(i*18)+"ms";});finish();},450);
}

const main = document.getElementById("main");
function route(){
  const path = (location.hash.replace(/^#/,"") || "/").replace(/\/+$/,"") || "/";
  let html, title = SITE.name, nav = "";
  const m = path.match(/^\/work\/([\w-]+)$/);
  if(path==="/"){ html=pageHome(); title=`${SITE.name} — Business Analytics, Strategy & Technology`; }
  else if(path==="/work"){ html=pageWork(); title=`Projects — ${SITE.name}`; nav="work"; }
  else if(m && byslug(m[1])){ const p=byslug(m[1]); html=pageCase(p); title=`${p.short} — ${SITE.name}`; nav="work"; }
  else if(path==="/experience"){ html=pageExperience(); title=`Experience — ${SITE.name}`; nav="experience"; }
  else if(path==="/about"){ html=pageAbout(); title=`About — ${SITE.name}`; nav="about"; }
  else if(path==="/contact"){ html=pageContact(); title=`Contact — ${SITE.name}`; nav="contact"; }
  else { html=pageNotFound(); title=`Not found — ${SITE.name}`; }

  main.classList.remove("enter"); void main.offsetWidth;
  main.innerHTML = html; main.classList.add("enter");
  document.title = title;
  document.querySelectorAll("[data-nav]").forEach(a=>{ if(a.dataset.nav===nav) a.setAttribute("aria-current","page"); else a.removeAttribute("aria-current"); });
  closeMenu();
  window.scrollTo(0,0);
  const h1 = main.querySelector("h1"); if(h1 && routed) h1.focus({preventScroll:true});
  routed = true;
  if(path==="/") playHero();
}
